name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build archives
        run: |
          mkdir -p dist
          chmod +x posix/*
          tar -czf dist/bin-posix.tar.gz -C posix .
          (cd win && zip -r ../dist/bin-win.zip .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/bin-posix.tar.gz dist/bin-win.zip --generate-notes
